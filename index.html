<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EMP — the event management platform for clubs and organizations: create and manage clubs, and run configurable events with registration, teams, activities, live leaderboards, and event-specific capabilities."
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6fb" />
    <title>EMP — Event Management Platform</title>
    <script>
      // Stamp the resolved theme before first paint so there is no flash of the
      // wrong theme. ThemeContext takes over once React mounts.
      try {
        var pref = localStorage.getItem('emp-theme')
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
